<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Chef Blade & Basil Flourish Icon -->
  <g id="chef-blade-icon">
    <!-- Motion Swoop Ring -->
    <path d="M 12 40 A 26 26 0 1 0 54 18" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" />

    <!-- Angled Chef Katana Blade -->
    <path d="M 16 22 L 46 48 C 48 50 51 50 52 48 L 57 42 C 58 40 57 37 54 35 L 26 12 C 24 10 20 12 18 15 Z" fill="#0F172A" />
    <!-- Blade Edge Gleam / Cutting Line -->
    <path d="M 21 24 L 48 48" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="21" cy="18" r="1.8" fill="#F8FAFC" />

    <!-- Cut Fresh Basil Leaf Falling -->
    <path d="M 40 16 C 48 14 56 18 54 26 C 52 32 44 32 40 28 C 36 24 36 18 40 16 Z" fill="#10B981" />
    <path d="M 42 19 Q 47 23 48 27" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round" />

    <!-- Chef Chili / Spice Spark -->
    <path d="M 52 50 Q 56 46 60 48 Q 58 54 52 50 Z" fill="#EF4444" />
    <circle cx="58" cy="46" r="1.2" fill="#FCA5A5" />
  </g>

  <!-- Typography -->
  <text x="84" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
    Food<tspan fill="#0D9488">Ninja</tspan>
  </text>
  <text x="85" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="1.8">
    ARTISAN GOURMET KITCHEN
  </text>
</svg>
