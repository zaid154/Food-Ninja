<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Monogram Hex Shield Icon -->
  <g id="monogram-shield-icon">
    <!-- Hexagon Outer Shield Base -->
    <path d="M 38 10 L 60 22 L 60 48 L 38 62 L 16 48 L 16 22 Z" fill="#0F172A" />
    <path d="M 38 13 L 57 24 L 57 46 L 38 58 L 19 46 L 19 24 Z" stroke="#1E293B" stroke-width="1.5" />

    <!-- Stylized "F" (Fork / Stem Silhouette) -->
    <path d="M 27 24 L 27 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 27 25 L 42 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 27 34 L 38 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Stylized "N" & Diagonal Katana Leaf Slash -->
    <path d="M 38 48 L 38 28" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 29 28 L 47 48" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 47 48 L 47 28" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

    <!-- Top Sprouting Leaf Accent -->
    <circle cx="47" cy="24" r="2.5" fill="#34D399" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
    Food<tspan fill="#10B981">Ninja</tspan>
  </text>
  <text x="83" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="1.8">
    FOOD DELIVERY APP
  </text>
</svg>
